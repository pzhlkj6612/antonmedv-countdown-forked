name: build

on:
  release:
    types:
      - created
  workflow_dispatch:

jobs:
  build_artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Ready to Go
        uses: actions/setup-go@v5.5.0
        with:
          go-version-file: "./go.mod"

      - name: Build
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          npm install zx

          npx zx .github/scripts/build.mjs $GITHUB_REPOSITORY
